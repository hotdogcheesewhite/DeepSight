### model
model_name_or_path: /mnt/nas-data-1/wuchangjie.wcj/work/bev_ex3_v2_fulldata/checkpoint-21000
image_max_pixels: 451584
video_max_pixels: 16384
trust_remote_code: true

enable_liger_kernel: false
use_unsloth_gc: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true # choices: [true, false]
freeze_multi_modal_projector: true # choices: [true, false]
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z0_config.json # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: bench2drive_bev_target
template: qwen2_vl
cutoff_len: 32768
max_new_tokens: 8192
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 32
tokenized_path: /mnt/nas-data-1/zhanglingjun.zlj1/cachedata/bev_v3_fulldata

### output
report_to: "tensorboard"
output_dir: v3_bev_target_fulldata_resume
logging_steps: 10
save_steps: 1000
plot_loss: true
save_only_model: true
overwrite_output_dir: true

### train
